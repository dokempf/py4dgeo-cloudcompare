# This section describes the requirements of the build/installation
# process itself. Being able to do this was the original reason to
# introduce pyproject.toml
[build-system]
requires = [
    "setuptools >=61",
]
build-backend = "setuptools.build_meta"

# This section provides general project metadata that is used across
# a variety of build tools. Notably, the version specified here is the
# single source of truth for py4dgeo_cloudcompare's version
[project]
name = "p4gcc"
description = "Run py4dgeo change analysis from CloudCompare"
readme = "README.md"
maintainers = [
    { name = "Dominic Kempf", email = "dominic.kempf@iwr.uni-heidelberg.de" },
]
version = "0.1.0"
requires-python = ">=3.10"
license-files = ["LICEN[CS]E*"]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "py4dgeo>=1.2.1",
    "PySide6>=6.5",
]

[project.entry-points."cloudcompare.plugins"]
hello = "py4dgeo_cloudcompare.plugin:HelloWorldPlugin"
m3c2 = "py4dgeo_cloudcompare.m3c2:M3C2Plugin"
m3c2_tkinter = "py4dgeo_cloudcompare.m3c2_tkinter:M3C2TkinterPlugin"
qt_versions = "py4dgeo_cloudcompare.qt_versions:QtVersionsPlugin"

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
]
docs = [
    "sphinx",
    "sphinx_mdinclude",
    "sphinx_rtd_theme",
]


# The following section contains setuptools-specific configuration
# options. For a full reference of available options, check the overview
# at https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
[tool.setuptools.packages.find]
where = ["src"]

# The following is the configuration for the pytest test suite
[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
